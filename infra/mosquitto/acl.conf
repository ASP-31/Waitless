# Waitless MQTT ACLs — local development.
#
# Anonymous access is disabled. The API gateway subscribes to all room topics;
# each room device may publish only to its own room using its username as the
# room code (for example OPD-1).

# API gateway (also used by the container healthcheck).
user waitless-gateway
topic read waitless/rooms/#
topic read $SYS/#

# Room devices. `%u` is the MQTT username, which must equal the Room.code.
# No read access and no access to another room's topics.
pattern write waitless/rooms/%u/occupancy
pattern write waitless/rooms/%u/heartbeat
