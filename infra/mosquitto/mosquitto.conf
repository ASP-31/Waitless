# Waitless MQTT broker — local development configuration.
#
# LOCAL DEV ONLY: credentials below are checked-in development values. Replace
# `passwd` with generated credentials for any shared or production deployment.
# Protocol contract: hardware/docs/contract.md.

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

# Keep the log readable while developing.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

persistence true
persistence_location /mosquitto/data/

max_queued_messages 1000
message_size_limit 8192
